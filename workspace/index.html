<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ax_ganes · workspace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23E55A1F'/><text x='16' y='22' font-size='18' font-family='system-ui,sans-serif' font-weight='bold' fill='white' text-anchor='middle'>g</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Ganes SaaS design tokens (frontend/ganes-owner/panda.config.mjs) */
:root{
  --bg:#FAFAFB;--surf1:#F5F2FA;--surf2:#ECE6F5;--surf3:#DDD3EE;--raised:#FFFFFF;
  --text:#1A1235;--text2:#564878;--text3:#9389AC;--mute:#B8AFCC;
  --border:rgba(31,21,67,.07);--border2:rgba(31,21,67,.14);--strong:rgba(31,21,67,.22);
  --accent:#3D1F87;--accentH:#2C1664;--accentSoft:rgba(61,31,135,.09);--accentSoft2:rgba(61,31,135,.18);--accentBd:rgba(61,31,135,.20);
  --pDarker:#0F0726;--pDark:#1A1042;--pD:#2C1664;--pL:#5B3EAA;
  --orange:#E55A1F;--orangeTint:#FFB892;--orangeSoft14:rgba(229,90,31,.14);--orangeSoft:rgba(229,90,31,.09);
  --danger:#C81E1E;--dangerSoft:rgba(200,30,30,.08);--dangerText:#9F1818;
  --success:#0F8F4D;--successSoft:rgba(15,143,77,.10);--successText:#0B6E3B;
  --warn:#C2780A;--warnSoft:rgba(194,120,10,.10);--warnText:#8C5707;
  --blue:#3A88F0;--blueSoft:rgba(58,136,240,.10);--blueText:#1F5FB0;
  --sbText:rgba(255,255,255,.58);--sbLabel:rgba(255,255,255,.30);
  --body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--display:'Instrument Sans','Inter',sans-serif;
  --panelW:360px;
  /* v3.3: workspace tokens mapped onto ganes-groceries-development (wireframe/styles.css :root).
     Home is no longer white/blue: lavender surface, dark-purple band, ink buttons, Inter + Instrument Sans. */
  --a:#3D1F87;--a08:rgba(61,31,135,.08);--a15:rgba(61,31,135,.15);--a30:rgba(61,31,135,.3);
  --t1:#1A1235;--t2:#564878;--t3:#564878;--t4:#7A6F96;--t5:#9389AC;--bd:rgba(31,21,67,.08);--bd2:rgba(31,21,67,.14);--bd3:rgba(31,21,67,.16);--card:#FFFFFF;--desk:#DDD3EE;
  --bg:#F5F2FA;--ink:#1A1042;--inkH:#2C1664;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--text);background:var(--desk);overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
[hidden]{display:none!important}
svg{flex:none}

/* ---------- v3.1 shell: tablet stage, header, All menus sheet, ask field (copied from workspace-v3.1) ---------- */
#wrap{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
#tab{width:1180px;height:820px;flex:none;border-radius:24px;overflow:hidden;position:relative;background:var(--bg);isolation:isolate;box-shadow:0 1px 3px rgba(0,0,0,.12),0 20px 60px rgba(20,12,48,.12);transform-origin:center center;display:flex;flex-direction:column}

.hd{position:relative;z-index:10;height:88px;flex:none;padding:22px 40px 0;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;color:inherit}
.logo{width:44px;height:44px;border-radius:12px;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;line-height:1;padding-bottom:4px}
.brand{text-decoration:none;color:inherit}
.brand b{display:block;font-size:17px;font-weight:700}
.brand small{display:block;margin-top:2px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--t4)}
.nav{display:flex;align-items:center;gap:8px;position:relative}
.hpill{height:44px;padding:0 16px 0 14px;border-radius:22px;border:1px solid var(--bd2);background:#fff;color:var(--t1);font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.hpill:hover{border-color:#C9CED6}
.hpill[aria-expanded=true]{border-color:var(--a);background:var(--a08)}
.alerts{height:44px;padding:0 14px;display:flex;align-items:center;gap:8px;color:var(--t2);font-size:15px;font-weight:500;cursor:default;border-radius:22px;position:relative}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#E6E8EC;color:var(--t1);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.alerts.pulse:after{content:"";position:absolute;inset:-2px;border-radius:24px;border:2px solid var(--a);animation:pl 1.4s ease-out infinite}
@keyframes pl{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.18)}}
.av{width:32px;height:32px;border-radius:16px;background:var(--t1);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.me{padding:0 12px 0 6px}
@keyframes cin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.askw{margin-top:auto;position:relative}
.ask{height:60px;border-radius:30px;background:#fff;border:1px solid var(--bd3);display:flex;align-items:center;gap:10px;padding:0 8px 0 20px;transition:border-color .15s,box-shadow .15s}
.ask:focus-within{border-color:var(--a);box-shadow:0 0 0 4px var(--a08)}
.ask.lis{border:2px solid var(--a)}
.ask input{flex:1;min-width:0;height:44px;border:0;outline:0;background:none;font-family:inherit;font-size:16px;color:var(--t1)}
.speak{height:44px;padding:0 16px 0 12px;border-radius:22px;border:0;background:var(--a08);color:var(--a);font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.speak.on{background:var(--a);color:#fff}
.askbtn{height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--a);color:#fff;font-size:15px;font-weight:600}
.tip{position:absolute;right:0;bottom:70px;background:var(--t1);color:#fff;font-size:13px;border-radius:10px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(20,12,48,.18);animation:cin .3s}
.tip button{height:32px;padding:0 10px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:600}
.tip:after{content:"";position:absolute;right:40px;bottom:-5px;width:10px;height:10px;background:var(--t1);transform:rotate(45deg)}
.dd{position:absolute;top:52px;right:0;width:300px;background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:0 16px 40px rgba(20,12,48,.14);padding:8px;z-index:30;animation:cin .2s}
.dd .who{display:flex;align-items:center;gap:12px;padding:10px 10px 12px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.dd .who b{display:block;font-size:15px}.dd .who small{display:block;font-size:12.5px;color:var(--t4)}
.dd .av{width:40px;height:40px;border-radius:20px;font-size:15px}
.di{width:100%;min-height:44px;padding:8px 10px;border:0;background:none;border-radius:10px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--t1);font-size:14.5px;font-weight:500}
.di:hover{background:var(--bg)}
.di svg{color:var(--t4);flex:none}
.di small{margin-left:auto;font-size:11.5px;color:var(--t5);font-weight:500}
.dh{margin:10px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--t4)}
.dsep{height:1px;background:var(--bd);margin:6px 2px}

/* All menus sheet */
.scrim{position:absolute;inset:0;background:rgba(20,12,48,.28);z-index:40;animation:fd .25s}
@keyframes fd{from{opacity:0}}
.sheet{position:absolute;left:50%;top:50%;width:820px;max-height:720px;transform:translate(-50%,-50%);background:#fff;border-radius:24px;box-shadow:0 24px 60px rgba(20,12,48,.22);z-index:41;display:flex;flex-direction:column;animation:shin .55s cubic-bezier(.16,1,.3,1)}
@keyframes shin{from{opacity:0;transform:translate(-50%,40%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}
.sh{padding:24px 28px 0;display:flex;align-items:flex-start;gap:16px}
.sh h3{margin:0;font-size:22px}.sh p{margin:4px 0 0;font-size:14px;color:var(--t4)}
.sh .sp{flex:1}
.close{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--bd2);background:#fff;font-size:14px;font-weight:600;color:var(--t2)}
.msrch{margin:16px 28px 0;height:44px;border:1px solid var(--bd3);border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 14px}
.msrch:focus-within{border-color:var(--a)}
.msrch input{flex:1;border:0;outline:0;font-family:inherit;font-size:15px}
.msb{overflow:auto;padding:4px 28px 8px}
.ms{margin-top:18px}
.ms h4{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--t4);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.ms h4:after{content:"";flex:1;height:1px;background:var(--bd)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mi{min-height:76px;padding:12px;border:1px solid var(--bd);border-radius:14px;background:#fff;display:flex;align-items:flex-start;gap:12px;text-align:left;animation:miIn .5s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(.12s + var(--i,0)*40ms)}
@keyframes miIn{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.mi:hover{border-color:var(--a);box-shadow:0 4px 14px rgba(61,31,135,.08)}
.mi .ti{width:40px;height:40px;flex:none;border-radius:12px;background:var(--a08);color:var(--a);display:flex;align-items:center;justify-content:center}
.mi .x{min-width:0}.mi b{display:block;font-size:15px;font-weight:600;color:var(--t1)}.mi small{display:block;margin-top:2px;font-size:12.5px;line-height:1.4;color:var(--t4)}
.mi .tbd{display:inline-block;margin-left:4px;font-size:10.5px;font-weight:700;color:var(--t4);background:#F2F4F7;border-radius:6px;padding:1px 5px;vertical-align:2px}
.sf{margin:12px 28px 24px;padding:12px 14px;border-radius:14px;background:var(--bg);display:flex;align-items:center;gap:12px;font-size:14px;color:var(--t3)}
.sf svg{color:var(--t4);flex:none}.sf b{color:var(--t1)}
.sf .sp{flex:1}
.ghost2{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--bd3);background:#fff;font-size:14px;font-weight:600;color:var(--t1);white-space:nowrap}
.empty{padding:30px 0;text-align:center;color:var(--t4);font-size:14px}
.ask.typ{border:2px solid var(--a)}

/* ---------- shell ---------- */
.app{position:absolute;inset:0;display:flex;transition:filter .55s cubic-bezier(.2,.8,.2,1),transform .55s cubic-bezier(.2,.8,.2,1);transform-origin:center}
body.priv .app{filter:blur(9px) saturate(.92);transform:scale(.995);pointer-events:none;user-select:none}
.veil{position:absolute;inset:0;z-index:60;background:radial-gradient(120% 90% at 85% 90%,rgba(246,247,249,.10),rgba(20,12,48,.14));opacity:0;pointer-events:none;transition:opacity .55s}
body.priv .veil{opacity:1;pointer-events:auto}

/* sidebar: dark purple gradient, as in DashboardLayout.recipe */
.sb{width:232px;flex:none;display:flex;flex-direction:column;padding:16px 11px 14px;background:linear-gradient(180deg,var(--pDarker) 0%,var(--pDark) 100%);color:var(--sbText);overflow-y:auto}
.sb::-webkit-scrollbar{width:0}
.sb-logo{display:flex;align-items:center;gap:9px;padding:0 7px;margin-bottom:16px;color:#fff}
.mark{width:26px;height:26px;border-radius:7px;background:var(--orange);color:#fff;display:grid;place-items:center;font:700 16px/1 var(--display);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.sb-logo b{font:600 15px/1 var(--display);letter-spacing:-.01em}
.sb-logo .sp{flex:1}
.ib{width:28px;height:28px;border-radius:7px;border:0;background:none;display:grid;place-items:center;color:inherit}
.ib:hover{background:rgba(255,255,255,.06)}
.sb-search{display:flex;align-items:center;gap:8px;height:32px;margin:0 0 12px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:12.5px}
.sb-search kbd{margin-left:auto;font:600 10.5px var(--body);color:rgba(255,255,255,.4)}
.sb-sec{padding:12px 9px 5px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sbLabel)}
.nv{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 9px;border:0;border-radius:8px;background:none;color:var(--sbText);font-size:13px;font-weight:500;text-align:left;text-decoration:none}
.nv:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.86)}
.nv.on{background:var(--orangeSoft14);color:#fff}
.nv.on svg{color:var(--orangeTint)}
.nv .ct{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.nv .chev{margin-left:auto;opacity:.45}
.sub{display:flex;flex-direction:column;padding-left:28px;margin:1px 0 3px}
.sub a{display:flex;align-items:center;gap:8px;height:27px;padding:0 9px;border-radius:7px;color:rgba(255,255,255,.48);font-size:12.5px;text-decoration:none}
.sub a:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8)}
.sub i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.22)}
.sub i.live{background:#34D399}
.sub .cts{font-size:10.5px;font-weight:700;color:var(--orangeTint)}
.sb-foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.07)}
.sb-user{display:flex;align-items:center;gap:9px;width:100%;padding:7px;border:0;border-radius:9px;background:none;text-align:left;color:#fff}
.sb-user:hover{background:rgba(255,255,255,.06)}
.sb-av{width:30px;height:30px;border-radius:9px;background:var(--pL);display:grid;place-items:center;font-weight:600;border:1px solid rgba(255,255,255,.08)}
.sb-user small{display:block;color:rgba(255,255,255,.55);font-size:11px;margin-top:1px}
.sb-user b{font-size:12.5px;font-weight:600}

/* main column: rounded white sheet like the reference, Ganes surfaces */
.mainc{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.top{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--raised)}
.top h1{margin:0;font:600 17px/1 var(--display);letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.top .sp{flex:1}
.seg{display:flex;padding:3px;border-radius:9px;background:var(--surf1);border:1px solid var(--border)}
.seg button{height:26px;padding:0 10px;border:0;border-radius:7px;background:none;font-size:12px;font-weight:500;color:var(--text2)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--text);box-shadow:0 1px 2px rgba(20,12,48,.08)}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border2);background:var(--raised);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--strong)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.btn.pri:hover{background:var(--accentH)}
.btn.ask{border-color:var(--accentBd);color:var(--accent);background:var(--accentSoft)}
.btn.ghost{border-color:transparent;background:none;color:var(--text2)}
.camchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--surf1);font-size:11.5px;font-weight:600;color:var(--text2)}
.camchip i{width:7px;height:7px;border-radius:4px;background:var(--mute)}
.camchip.on i{background:#0F8F4D;box-shadow:0 0 0 3px rgba(15,143,77,.15)}
.camchip.alert i{background:var(--danger)}
.content{flex:1;overflow-y:auto;padding:4px 40px 40px}
.grid{display:grid;gap:14px}
.card{background:var(--raised);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(20,12,48,.04);padding:16px 18px;position:relative}
.card h3{margin:0;font:600 13.5px/1.2 var(--display);letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.card h3 .act{margin-left:auto;font:500 12px var(--body);color:var(--accent);background:none;border:0;padding:0}
.muted{color:var(--text3)}

.health{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--warnSoft);border:1px solid rgba(194,120,10,.18);color:var(--warnText)}
.health b{font-weight:600;color:var(--text)}
.health.ok{background:var(--successSoft);border-color:rgba(15,143,77,.18);color:var(--successText)}
.calm{display:grid;gap:16px;max-width:1080px;margin:0 auto}
/* v3.2.2 clean home: one primary, two quiet secondary, semantic items */
.home{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-height:100%}
.home .askw{margin-top:4px}
.hello .date{font-size:12px;color:var(--text3);font-weight:500}
.hello h1{margin:6px 0 0;font:600 30px/1.15 var(--display);letter-spacing:-.025em}
.hello p{margin:6px 0 0;color:var(--text2);font-size:14px}
.fwrap{position:relative;isolation:isolate}
.focus{position:relative;z-index:1;background:var(--raised);border:1px solid var(--border);border-radius:20px;padding:24px 26px;box-shadow:0 1px 2px rgba(20,12,48,.04),0 12px 32px rgba(61,31,135,.06)}
.focus .fh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600}
.focus .fh span{display:inline-flex;align-items:center;gap:6px;color:var(--accent)}
.focus .fh span.urg{color:var(--danger)}.focus .fh span.okk{color:var(--success)}
.focus .fh i{width:7px;height:7px;border-radius:4px;background:currentColor}
.focus .fh em{font-style:normal;color:var(--text3);font-weight:500}
.focus h2{margin:10px 0 6px;font:600 22px/1.25 var(--display);letter-spacing:-.02em}
.focus p{margin:0;color:var(--text2);font-size:14px;line-height:1.55}
.focus .draft{font-size:13.5px;padding:12px 14px}
.src2{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:var(--text3)}
.fa{display:flex;align-items:center;gap:8px;margin-top:18px}
.btn.big{height:40px;padding:0 18px;font-size:13.5px}
.orbs{position:absolute;inset:-70px -60px;z-index:0;pointer-events:none}
.ob{position:absolute;border-radius:50%;filter:blur(26px);opacity:.9}
.ob.o1{width:300px;height:300px;right:-10px;top:-30px;background:radial-gradient(circle at 40% 40%,rgba(91,62,170,.28),rgba(91,62,170,.08) 55%,transparent 72%);animation:ofl1 34s ease-in-out infinite}
.ob.o2{width:220px;height:220px;left:-20px;bottom:-40px;background:radial-gradient(circle,rgba(229,90,31,.16),rgba(229,90,31,.05) 55%,transparent 72%);animation:ofl2 42s ease-in-out infinite}
.ob.o3{width:160px;height:160px;left:40%;top:-50px;background:radial-gradient(circle,rgba(58,136,240,.14),transparent 70%);animation:ofl1 50s ease-in-out infinite reverse}
@keyframes ofl1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,26px) scale(1.12)}}
@keyframes ofl2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(36px,-20px) scale(1.1)}}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid var(--border)}
.mini b{display:block;font-size:13px;font-weight:600}
.mini small{display:flex;align-items:center;gap:4px;margin-top:3px;color:var(--text2);font-size:12px}
.mi-i{width:30px;height:30px;border-radius:9px;background:var(--surf1);color:var(--accent);display:grid;place-items:center;flex:none}
.lnk{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.lnk em{font-style:normal;display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;margin-left:3px;border-radius:8px;background:var(--orangeSoft14);color:var(--orange);font-size:10.5px}
.sem{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--text3)}
.sem .st{display:inline-flex;align-items:center;gap:6px}.sem .st i{width:7px;height:7px;border-radius:4px;background:var(--success)}
@media (prefers-reduced-motion:reduce){.ob{animation:none}}

/* ---------- Orka: the ax_ganes mascot, always outside the blur ----------
   Moves like the Chrome offline dino: runs along the bottom toward the pointer in real time,
   leans into the run, hops when the pointer comes close. Only 2D moves, so the head never warps. */
.orka{position:absolute;z-index:80;left:0;bottom:56px;width:72px;height:72px;border:0;padding:0;background:none;will-change:transform;transition:opacity .25s,width .4s,height .4s}
body.ax-open.orka-dock .orka{opacity:0;pointer-events:none}
.orka .ohd{position:absolute;inset:0;transform-origin:50% 92%;will-change:transform;filter:drop-shadow(0 10px 12px rgba(15,7,38,.26))}
.orka img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
/* face layer: the visor content (eyes + mouth) is clipped to the visor and slides toward the cursor */
.orka .face{position:absolute;inset:0;clip-path:inset(30% 16% 24% 16% round 26%);pointer-events:none}
.orka .face img{will-change:transform}
.orka:focus-visible{outline:3px solid var(--orange);outline-offset:4px;border-radius:50%}
.orka .shadow{position:absolute;left:20%;right:20%;bottom:-10px;height:10px;border-radius:50%;background:rgba(15,7,38,.24);filter:blur(4px);will-change:transform,opacity}
.orka .dust{position:absolute;bottom:-6px;width:6px;height:6px;border-radius:50%;background:rgba(229,90,31,.35);opacity:0}
.orka.land .dust{animation:dust .45s ease-out}
.orka .dust.l{left:22%;--dx:-16px}.orka .dust.r{right:22%;--dx:16px}
@keyframes dust{0%{opacity:.8;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),-6px) scale(.3)}}
body.priv .orka{opacity:1!important;pointer-events:auto}
.bub{position:absolute;z-index:81;left:0;bottom:168px;width:max-content;max-width:300px;padding:12px 14px;border-radius:16px;background:#fff;color:var(--text);box-shadow:0 12px 32px rgba(15,7,38,.18),0 0 0 1px var(--border);font-size:12.5px;line-height:1.5;transform-origin:bottom center;animation:bin .35s cubic-bezier(.2,.9,.3,1.3)}
.bub:after{content:"";position:absolute;left:var(--tail,50%);bottom:-7px;width:14px;height:14px;margin-left:-7px;background:#fff;transform:rotate(45deg);box-shadow:3px 3px 4px rgba(15,7,38,.05)}

body.priv .bub{max-width:300px}
body.demo .app,body.demo .orka,body.demo .veil{transition:none!important}

@keyframes bin{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}

function render(){

  document.body.classList.toggle('ax-open',S.panel);

  document.body.classList.toggle('fp-on',!!(S.panel&&S.fp));
  $('#layer').innerHTML=(S.menus?menusSheet():'')+(S.settings?settingsModal():'')+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');

  renderPoc();
}

/* ===================== Orka ===================== */
let faceT=0;
function setOrkaImg(src){const a=$('#orkaImg'),b=$('#orkaFace');if(a)a.src=src;if(b)b.src=src}
function face(e,ms){S.face=e;setOrkaImg(ORKA(EXPR[e]));const f=$('#axFace');if(f)f.src=ORKA(EXPR[e]);clearTimeout(faceT);if(ms)faceT=setTimeout(()=>face('idle'),ms)}
/* idle blink */
setInterval(()=>{if(S.face&&S.face!=='idle')return;setOrkaImg(ORKA(EXPR.blink));setTimeout(()=>{if(!S.face||S.face==='idle')setOrkaImg(ORKA(EXPR.idle))},140)},4200);
/* Orka stays in place. Only the face reacts: eyes/visor look toward the cursor, the head turns a little (2D),
   cursor shaking makes Orka dizzy, then pouting. */
const O={sl:0,x:0,y:0,mx:innerWidth/2,my:innerHeight/2,lx:0,ly:0,dirs:[],lastDx:0,mood:0};
document.addEventListener('mousemove',e=>{
  const dx=e.clientX-O.mx;O.mx=e.clientX;O.my=e.clientY;
  /* shake = 5+ quick direction changes within 700 ms */
  if(Math.abs(dx)>6){const d=Math.sign(dx);if(d!==O.lastDx){O.dirs.push(Date.now());O.lastDx=d}}
  O.dirs=O.dirs.filter(t=>Date.now()-t<700);
  if(O.dirs.length>=5&&Date.now()-O.mood>2600&&S.set.follow){O.mood=Date.now();O.dirs=[];dizzy()}
});

/* v3.3 — sleepy Orka: after 5 s with no pointer, key, touch or scroll, Orka gets sleepy (eyes closed, Zzz),
   the head slowly drops, then nods down hard and wakes up startled. Back awake it carries on as before:
   if something needs you, it nudges. Any input while sleepy wakes it too. */
const SL={on:false,nod:false,drop:0,last:Date.now(),t:[],off:false,IDLE:5000};
function slClear(){SL.t.forEach(clearTimeout);SL.t=[]}
function sleepOrka(){SL.on=true;SL.drop=.55;SL.nod=false;document.body.classList.add('orka-sleepy');face('sleepy');
  SL.t.push(setTimeout(()=>{SL.drop=1},1600));                       /* head keeps sinking */
  SL.t.push(setTimeout(()=>{SL.nod=true;SL.drop=1.7},3000));         /* head falls */
  SL.t.push(setTimeout(()=>wakeOrka(true),3450))}                    /* …and Orka startles awake */
function wakeOrka(self){if(!SL.on)return;slClear();SL.on=false;SL.nod=false;SL.drop=0;SL.last=Date.now();document.body.classList.remove('orka-sleepy');
  const o=$('#orka');if(o){o.classList.remove('jolt');void o.offsetWidth;o.classList.add('jolt');setTimeout(()=>o.classList.remove('jolt'),600)}
  face('surprised',1300);bubbleSmall(self?'Huh! I’m awake 👀':'Oh! You’re back 👋');
  SL.t.push(setTimeout(()=>{bubbleClearSmall();if(curTask())nudge()},1500))}
function slActive(){SL.last=Date.now();if(SL.on)wakeOrka(false)}
['mousemove','mousedown','keydown','touchstart','wheel','scroll'].forEach(ev=>addEventListener(ev,e=>{if(e.isTrusted)slActive()},{passive:true,capture:true}));
setInterval(()=>{if(SL.off||SL.on||selfTesting)return;const busy=S.panel||S.menus||S.settings||$('.bub:not(.sm)')||document.body.classList.contains('priv')||(S.face&&S.face!=='idle');
  if(busy){SL.last=Math.max(SL.last,Date.now()-SL.IDLE+1500);return}
  if(Date.now()-SL.last>SL.IDLE)sleepOrka()},250);
function dizzy(){face('thinking');bubbleSmall('Whoa… dizzy! 😵‍💫');setTimeout(()=>{face('talk2');bubbleSmall('Hmph. Please slow down.')},1500);setTimeout(()=>{face('idle');bubbleClearSmall()},2900)}
let smallT=0;function bubbleSmall(t){if($('.bub:not(.sm)'))return;$('#bubble').innerHTML=`<div class="bub sm" role="status">${t}</div>`;clearTimeout(smallT);smallT=setTimeout(bubbleClearSmall,3200)}
function bubbleClearSmall(){const b=$('.bub.sm');if(b)b.remove()}
let TW=1180,TH=820;
/* v3.4.1: Orka keeps its corner while it melts into the room, so it never jumps sideways */
function orkaBounds(){const w=$('#orka').offsetWidth||72;return {w,x:TW-w-28}}
let lastFrame=0;
function orkaStep(){lastFrame=Date.now();
  const el=$('#orka'),hd=$('#orkaHd'),fc=$('#orkaFace');
  if(el&&hd){
    const pv=document.body.classList.contains('priv'),{w,x}=orkaBounds();
    O.x=x;
    el.style.transform=`translate(${O.x}px,0)`;
    const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;   /* screen coords, works with the tablet scale */
    let tx=0,ty=0;
    if(S.set.follow&&!SL.on){const dx=O.mx-cx,dy=O.my-cy,d=Math.hypot(dx,dy)||1,k=Math.min(1,d/260);tx=dx/d*k;ty=dy/d*k}
    O.lx+=(tx-O.lx)*.18;O.ly+=(ty-O.ly)*.18;
    const t=Date.now(),breathe=Math.sin(t/900)*1.2;
    /* head turns a little toward the cursor, no 3D, so the shape never warps */
    /* time-based easing so the droop looks the same at any frame rate */
    const now=performance.now(),dt=Math.min(100,now-(O.lt||now));O.lt=now;
    O.sl+=((SL.on?SL.drop:0)-O.sl)*(1-Math.pow(1-(SL.nod?.35:.04),dt/16.7));
    hd.style.transform=`translate(${O.lx*2.5+O.sl*3}px,${O.ly*2+breathe*(1-O.sl*.6)+O.sl*9}px) rotate(${O.lx*6+O.sl*16}deg)`;
    if(fc)fc.style.transform=`translate(${O.lx*w*.07}px,${O.ly*w*.05}px)`;
    placeBubble(O.x,w,pv);
  }
}
(function loop(){orkaStep();requestAnimationFrame(loop)})();
/* some embedded previews pause animation frames; keep Orka alive anyway */
setInterval(()=>{if(Date.now()-lastFrame>120)orkaStep()},33);
function placeBubble(x,w,pv){const b=$('.bub');if(!b)return;const bw=b.offsetWidth,cx=x+w/2;
  const left=Math.max(12,Math.min(TW-bw-12,cx-bw/2));b.style.left=left+'px';b.style.setProperty('--tail',(cx-left)+'px');
  b.style.bottom=(56+w+12)+'px'}
function orkaTransform(){return $('#orka').style.transform}
function faceTransform(){return $('#orkaFace').style.transform}

/* speech bubble */

  if(ms)bubT=setTimeout(()=>{if(!document.body.classList.contains('priv'))$('#bubble').innerHTML=''},ms);
  requestAnimationFrame(()=>orkaStep());setTimeout(orkaStep,450);
}
function bubbleClear(){clearTimeout(bubT);$('#bubble').innerHTML=''}
let nudgeI=0,nudgeT=0;

  if(!S.set.nudges||S.panel||S.menus||S.settings||document.body.classList.contains('priv'))return;

/* ===================== panel actions ===================== */
/* v3.4.1: opening from Orka (no task) also unfolds the Focus page out of the room; a direct task goes straight to the room */
const FPK='ax34-focus-seen';
function dayPart(){const h=new Date().getHours();return h<11?'morning':h<15?'afternoon':'evening'}
function fpDue(){try{return sessionStorage.getItem(FPK)!==dayPart()}catch(e){return !AN.fpSeen}}
function fpSeen(){AN.fpSeen=true;try{sessionStorage.setItem(FPK,dayPart())}catch(e){}}
/* device back from sleep (tab hidden ≥ 30 min) with a new recommendation → Focus is due again */
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}
  if(hiddenAt&&Date.now()-hiddenAt>=30*60e3&&curTask()){try{sessionStorage.removeItem(FPK)}catch(e){}AN.fpSeen=false}});
function openPanel(task){const was=S.panel;S.panel=true;S.menu=false;bubbleClear();
  if(!was){S.fp=!task&&fpDue();if(S.fp)fpSeen()}
  if(task){const open=TASKS.filter(t=>!S.done[t.id]);const k=open.findIndex(t=>t.id===task);if(k>=0){S.t=k;S.step='card'}}
  face('happy',1600);render();later(700,()=>{const i=$('#axIn');if(i&&S.panel)i.focus()})}
/* closing plays the bubble shrink (room) and the slide back to the right (Focus page) before the DOM goes */
function closePanel(){S.panel=false;S.listen=false;S.fp=false;S.plus=false;document.body.classList.remove('fp-on');
  const r=$('.axin'),f=$('.fpage');
  if(selfTesting||(!r&&!f)){render();return}
  if(r)r.classList.add('leaving');if(f)f.classList.add('leaving');
  document.body.classList.remove('orka-dock','ax-open');   /* width goes back → the client page slides back to the right */
  later(320,()=>{if(!S.panel)render()})}
function hideFocus(){const f=$('.fpage');S.fp=false;document.body.classList.remove('fp-on');if(!f||selfTesting){render();return}f.classList.add('leaving');later(440,()=>{if(!S.fp)render()})}
/* every action on the Focus page continues inside the room, never on a new page */
function toRoom(fn){fn();render();later(60,()=>{const c=$('.axb .fc');if(c){c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');c.scrollIntoView({block:'nearest',behavior:'smooth'})}})}
function curTask(){const open=TASKS.filter(t=>!S.done[t.id]);return open.length?open[S.t%open.length]:null}
function approve(){const t=curTask();if(!t)return;S.step='working';face('thinking');
  /* rules: permission checked again before acting (G1), risk class from the inventory (G2) */
  render();$('.fc .acts')&&($('.fc .acts').innerHTML=`<span class="typing"><i></i><i></i><i></i></span><span class="muted" style="font-size:12px">Checking your rights, then running…</span>`);
  later(900,()=>{S.done[t.id]=1;S.lastDone=t;S.lastId=t.id;S.step='done';S.t=0;face('delighted',2200);render();toast(`${t.done}`)})}
function undo(){if(!S.lastId)return;delete S.done[S.lastId];S.step='card';S.t=0;face('content',1200);render();toast('Undone. Nothing changed.')}
let toastT=0;function toast(m,ms=2600){S.toast=esc(m);render();clearTimeout(toastT);toastT=setTimeout(()=>{S.toast='';render()},ms)}

/* chat: ax_ganes reads the store and prepares the change; the person confirms */
function ask(q){
  q=(q||'').trim();if(!q)return;
  S.chat.push({who:'u',text:q});S.chat.push({typing:1});S.scroll=true;face('thinking');render();
  later(800,()=>{S.chat.pop();S.chat.push(answer(q));S.scroll=true;face('content',1600);render()});
}
function answer(q){
  const i=S.chat.length,l=q.toLowerCase();
  if(P.stockRe.test(l)&&/(left|stock|sisa|how many)/.test(l))return {who:'a',i,text:P.stockA,rows:[[P.stockU===''?'Status':'Stock',P.stockU===''?['Stuck','Waiting for document']:['0',P.stockA.match(/<b>(\d+)<\/b> units/)[1]]],['Source',P.src]],ok:P.stockU===''?'Prepare requests':'Update stock'};
  if(/price|harga/.test(l)&&/\d+\s*%/.test(l)){const p=+l.match(/(\d+)\s*%/)[1];const old=P.priceOld,n=Math.round(old*(1+p/100)/1000)*1000;
    return {who:'a',i,text:`Here is the change for <b>${P.priceN}</b>. I checked your rights: Owner can edit prices.`,rows:[['Price',[idr(old),idr(n)]],['Source','Products · current price']],ok:'Approve price'}}
  if(/answer gaps|draft answer/.test(l))return {who:'a',i,text:`I grouped 9 unanswered questions and drafted 3 answers from your documents:<br>${P.gapsA}`,ok:'Add to knowledge'};
  if(/edit a product|product description/.test(l))return {who:'a',i,text:`Which product? I can write the description, title and tags with ✨, and you pick the tone. Try <b>“${P.stockN}, friendly tone”</b>.`};
  if(/what can you do/.test(l))return {who:'a',i,text:`I read your store and do the work for you, one task at a time: reply to customers, fix stock, read documents again, write product texts, and change prices with a preview. Nothing changes until you approve.`};
  if(/needs attention/.test(l))return {who:'a',i,text:P.needA};
  if(/return|retur/.test(l))return {who:'a',i,text:P.retA};
  return {who:'a',i,text:`I looked at Overview for the last 7 days: 1,284 chats, 86% solved by the chatbot, 37 handed to a person. The busiest day was Friday. Want me to open the busiest hours?`};
}
const idr=n=>'Rp '+n.toLocaleString('id-ID');

/* ===================== camera: privacy guard + gestures ===================== */
let vision=null,faceDet=null,gestRec=null,camStream=null,camLoopOn=false;
async function camOn(mode){
  S.cam.on=true;S.cam.mode=mode||S.cam.mode;S.cam.faces=1;render();
  if(S.cam.mode!=='real')return;
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
    const v=$('#camv');v.srcObject=camStream;await v.play();
    vision=vision||await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    faceDet=faceDet||await vision.FaceDetector.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',delegate:'GPU'},runningMode:'VIDEO',minDetectionConfidence:.55});
    gestRec=gestRec||await vision.GestureRecognizer.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1});
    camLoopOn=true;let last=-1,lastF=0;
    (function step(){if(!camLoopOn)return;const v=$('#camv');const now=performance.now();
      if(v.readyState>=2&&v.currentTime!==last&&now-lastF>90){last=v.currentTime;lastF=now;const ts=Math.round(now);
        try{const f=faceDet.detectForVideo(v,ts);peopleSeen(f.detections.length||0);const b0=f.detections[0]&&f.detections[0].boundingBox;window.orkaCam=b0?[Math.max(-1,Math.min(1,-((b0.originX+b0.width/2)/v.videoWidth*2-1)*1.7)),Math.max(-1,Math.min(1,((b0.originY+b0.height/2)/v.videoHeight*2-1)*1.7))]:null}catch(e){}
        try{if(S.set.gestures){const g=gestRec.recognizeForVideo(v,ts+1);const c=g.gestures[0]&&g.gestures[0][0];poseSeen(c&&c.score>.6?MP[c.categoryName]:null)}}catch(e){}}
      requestAnimationFrame(step)})();
  }catch(e){S.cam.mode='sim';toast('Camera not available here. Using simulated camera (keys P, V, U, O, M, F).',4200);render()}
}
function camOff(){camLoopOn=false;if(camStream)camStream.getTracks().forEach(t=>t.stop());camStream=null;S.cam.on=false;S.cam.faces=1;privacy(false);render()}

/* privacy guard: >1 person for 0.6 s → blur; 1 person for 1.2 s → clear */
let manyT=0,fewT=0;
function peopleSeen(n){
  if(n===S.cam.faces)return;S.cam.faces=n;
  clearTimeout(manyT);clearTimeout(fewT);
  if(n>1){if(!S.alone)manyT=setTimeout(()=>privacy(true),600)}
  else{S.alone=false;fewT=setTimeout(()=>privacy(false),1200)}
  const chip=$('.camchip');if(chip){chip.className='camchip'+(S.cam.on?(n>1?' alert':' on'):'');chip.lastChild.textContent=n>1?`${n} people seen`:'1 person · private'}
}
function privacy(on){
  if(on&&(!S.set.privacy||!S.cam.on))return;
  const was=document.body.classList.contains('priv');
  document.body.classList.toggle('priv',on);
  if(on&&!was){face('surprised');setTimeout(()=>{if(document.body.classList.contains('priv'))face('focus')},1400);
    bubble(`<b>Someone is behind you.</b><br>I softened the screen to keep customer data private. It clears by itself when you’re alone.`,`<button class="lnk" data-a="alone" type="button">Show anyway</button>`)}
  if(!on&&was){bubbleClear();face('happy',1500);setTimeout(()=>bubbleSmall('All clear, welcome back 👋'),60)}
}

/* gestures: team default map, hold 0.8 s → run; fist cancels */
const GEST={palm:{icon:'🖐',name:'Open palm',label:'open ax_ganes'},peace:{icon:'✌️',name:'V sign',label:'talk to ax_ganes'},thumb:{icon:'👍',name:'Thumb up',label:'Needs Attention'},point:{icon:'☝️',name:'Point up',label:'stock alert'},fist:{icon:'✊',name:'Fist',label:'cancel'}};
const MP={Open_Palm:'palm',Victory:'peace',Thumb_Up:'thumb',Pointing_Up:'point',Closed_Fist:'fist'};
S.g={pose:null,p:0};let holdT=0,holdStart=0;
function poseSeen(p){
  if(!S.set.gestures)return;
  if(p===S.g.pose)return;
  S.g.pose=p;S.g.p=0;clearInterval(holdT);
  if(!p){render();return}
  if(p==='fist'){S.g.pose=null;runGesture('fist');return}
  holdStart=Date.now();render();
  holdT=setInterval(()=>{S.g.p=Math.min(1,(Date.now()-holdStart)/800);const b=$('.gst .bar i');if(b)b.style.width=Math.round(S.g.p*100)+'%';
    if(S.g.p>=1){clearInterval(holdT);const q=S.g.pose;S.g.pose=null;runGesture(q)}},50);
  if(!S.panel){bubble(`${GEST[p].icon} <b>${GEST[p].name}</b>: hold to ${GEST[p].label}`,null,1200)}
}
function runGesture(p){
  if(p==='palm'){S.panel?closePanel():openPanel()}
  else if(p==='peace'){if(!S.panel)openPanel();startListen()}
  else if(p==='thumb')openPanel('reply');
  else if(p==='point')openPanel('stock');
  else if(p==='fist'){if(S.menus){S.menus=false;render()}else if(S.listen){S.listen=false;render()}else if(S.panel)closePanel();bubbleClear()}
}

/* voice: Web Speech API when available, otherwise a simulated phrase */
let rec=null;
function startListen(){
  S.listen=true;face('listening');render();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR&&!new URLSearchParams(location.search).has('selftest')){try{rec=new SR();rec.lang='en-US';rec.onresult=e=>{S.listen=false;ask(e.results[0][0].transcript)};rec.onend=()=>{if(S.listen){S.listen=false;render()}};rec.start();return}catch(e){}}
  later(1400,()=>{if(S.listen){S.listen=false;ask(STOCKQ)}});
}

document.addEventListener('input',e=>{if(e.target.id==='mq'){S.mq=e.target.value;render()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='axIn'){ask(e.target.value);e.target.value='';return}
  if(e.key==='Enter'&&e.target.id==='askIn'){const q=e.target.value;e.target.value='';openPanel();if(q.trim())ask(q);return}
  if(e.key==='`'){S.poc=!S.poc;renderPoc();return}
  if(e.key==='Escape'){if(S.settings){S.settings=false;render()}else if(S.menus){S.menus=false;render()}else if(S.menu){S.menu=false;render()}return}
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();if(e.repeat)return;
  if(k==='p'){if(!S.cam.on)camOn('sim');peopleSeen(S.cam.faces>1?1:2);return}
  const map={v:'peace',u:'thumb',o:'point',m:'palm'};
  if(k==='f'){runGesture('fist');return}
  if(map[k]&&S.set.gestures){if(!S.cam.on)camOn('sim');poseSeen(map[k])}
});

const DEMO=(location.search.match(/[?&]demo=(\w+)/)||[])[1];
/* storyboard screenshots: ?shot=closed|room|focus|progress|preview|chat|plus|settings|nudge|sleepy|dizzy|priv|gesture
   (settled frame, no motion, POC tools hidden) */
const SHOT=(location.search.match(/[?&]shot=(\w+)/)||[])[1];

  const st=document.createElement('style');st.textContent='body.shot *{animation:none!important;transition:none!important}body.shot .pocb{display:none!important}';document.head.appendChild(st);
  try{sessionStorage.setItem(FPK,dayPart())}catch(e){}
  const room=fp=>{S.panel=true;S.fp=!!fp;render()};
  ({closed:()=>render(),
    room:()=>room(false),
    focus:()=>room(true),
    progress:()=>{room(true);S.step='preview';render()},
    preview:()=>{room(false);S.step='preview';render()},
    chat:()=>{room(false);S.chat=[{who:'u',text:'Raise Power Bank price by 5%'}];S.chat.push(answer('Raise Power Bank price by 5%'));AN.n=99;render()},
    plus:()=>{room(false);S.plus=true;render()},

    sleepy:()=>{render();SL.on=true;SL.drop=1;O.sl=1;document.body.classList.add('orka-sleepy');face('sleepy')},
    dizzy:()=>{render();face('thinking');bubbleSmall('Whoa… dizzy! 😵‍💫')},

}
if(DEMO==='panel'){openPanel('reply');S.step='preview';render()}
else if(DEMO==='priv'){camOn('sim');setTimeout(()=>peopleSeen(2),50)}
else if(DEMO==='nudge'){setTimeout(nudge,50)}
else if(!DEMO&&!SHOT&&!/[?&]selftest=1/.test(location.search)){
  /* v3.4: the kit greets on arrival — the room slides in next to the host app, like Sidekick */
  if(!/[?&]closed=1/.test(location.search)&&fpDue())setTimeout(()=>{if(!S.panel)openPanel()},700);
  scheduleNudges();}
if(DEMO){document.body.classList.remove('poc-avail');document.body.classList.add('demo')}

<script>
/* v3.5 Orka: faces forward, eyes follow cursor, last touch, or the camera; expressions come from the existing face() calls */
(function(){const EYE={idle:'<ellipse rx="11.5" ry="16"/>',wow:'<ellipse rx="14" ry="20"/>',small:'<ellipse rx="10" ry="12.5"/>',pout:'<ellipse rx="11" ry="10"/>',happy:'<path class="s" d="M-14 5Q0-15 14 5"/>',closed:'<path class="s" d="M-12 0H12"/>'},
MOUTH={idle:'<path class="s" d="M-13 0Q0 10 13 0"/>',happy:'<path class="s" d="M-21-3Q0 19 21-3"/>',wow:'<ellipse rx="7" ry="9"/>',pout:'<path class="s" d="M-11 4Q0-6 11 4"/>',small:'<path class="s" d="M-7 0Q0 4 7 0"/>',flat:'<path class="s" d="M-6 0H6"/>',speak:'<ellipse rx="9" ry="7"/>'},
MAP={idle:['idle','idle'],blink:['closed','idle'],happy:['happy','happy'],content:['happy','idle'],delighted:['happy','happy'],listening:['small','small'],thinking:['small','flat'],confused:['pout','pout'],surprised:['wow','wow'],sorry:['small','pout'],shy:['happy','small'],focus:['small','flat'],speaking:['idle','speak']};
const hd=document.getElementById('orkaHd'),src=document.getElementById('orkaImg'),orka=document.getElementById('orka');
const base=new Image();base.src='assets/orka/orka_base.png';base.alt='';base.className='obase';hd.appendChild(base);
const layer=(c,set)=>{const d=document.createElement('span');d.className='fl '+c;d.innerHTML='<svg viewBox="-32 -32 64 64" aria-hidden="true">'+Object.keys(set).map(k=>'<g data-k="'+k+'">'+set[k]+'</g>').join('')+'</svg>';hd.appendChild(d);return d};
const EL=layer('el',EYE),ER=layer('er',EYE),MO=layer('mo',MOUTH);
const show=(l,k)=>l.querySelectorAll('g').forEach(g=>g.classList.toggle('on',g.dataset.k===k));
function apply(){const m=/orka_\d+_([a-z]+)/.exec(src.getAttribute('src')||'')||[],e=MAP[m[1]]||MAP.idle;show(EL,e[0]);show(ER,e[0]);show(MO,e[1])}
new MutationObserver(apply).observe(src,{attributes:true,attributeFilter:['src']});apply();
let px=null,py=0,last=0,gx=0,gy=0,vx=0,vy=0,lt=performance.now();
addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;last=performance.now()},{passive:true});addEventListener('pointerdown',e=>{px=e.clientX;py=e.clientY;last=performance.now()},{passive:true});
let ac;orka.addEventListener('click',()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();let w=ac.currentTime;const r=(x,y)=>x+Math.random()*(y-x);for(let i=0,n=3+Math.floor(Math.random()*3);i<n;i++){const d=r(.045,.11),f=r(780,1750),o=ac.createOscillator(),g=ac.createGain();o.type=i%2?'square':'triangle';o.frequency.setValueAtTime(f,w);o.frequency.exponentialRampToValueAtTime(f*(Math.random()<.5?r(1.2,1.7):r(.65,.85)),w+d);g.gain.setValueAtTime(.0001,w);g.gain.exponentialRampToValueAtTime(i%2?.03:.065,w+.01);g.gain.exponentialRampToValueAtTime(.0001,w+d);o.connect(g);g.connect(ac.destination);o.start(w);o.stop(w+d+.03);w+=d*r(.75,1.15)}});
(function loop(){const t=performance.now(),sd=Math.min(t-lt,50)/1000;lt=t;let ex=0,ey=0;
 if(px!==null){const r=orka.getBoundingClientRect(),dx=px-(r.left+r.width/2),dy=py-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/90);ex=dx/d*k;ey=dy/d*k}
 if(window.orkaCam&&t-last>1200){ex=orkaCam[0];ey=orkaCam[1]}
 vx+=((ex-gx)*300-vx*30)*sd;gx+=vx*sd;vy+=((ey-gy)*300-vy*30)*sd;gy+=vy*sd;
 const eye='translate3d('+gx*37+'%,'+gy*27+'%,0)';EL.style.transform=eye;ER.style.transform=eye;MO.style.transform='translate3d('+gx*26+'%,'+gy*19+'%,0)';requestAnimationFrame(loop)})();
})();
